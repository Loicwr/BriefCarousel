<!DOCTYPE html>
<html lang="fr">
<head>

    <title>carousel d'images</title>
    <link rel="stylesheet" href="sass/main.css">
</head>
<body>
    <main>
        <header>
            <h1>Voici mon carrousel</h1>

        </section>
    </main>
    <script src="./js/index.js"></script>
